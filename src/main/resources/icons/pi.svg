<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    Pi glyph drawn with paths. Using <text> would depend on font fallback and
    shift the baseline between platforms, which is not acceptable for an icon
    that is rendered at 13-16px.
  -->
  <rect width="16" height="16" rx="4" fill="#6366F1"/>
  <g stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M4.2 5.6h7.6"/>
    <path d="M6.4 5.6v5.1"/>
    <path d="M9.6 5.6v5.1"/>
  </g>
</svg>
